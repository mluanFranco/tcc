server {
    absolute_redirect off;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A raiz leva direto ao login (não há index.html no frontend).
    location = / {
        return 302 /pages/login.html;
    }

    location / {
        try_files $uri =404;
        # Sem cache agressivo: ao editar um arquivo e dar F5, o navegador pega a versão nova.
        add_header Cache-Control "no-cache";
    }

    # Imagens e fontes mudam raramente.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
