<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupos de Acesso — Nova Sorvetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/pedido-compra.css">
  <link rel="stylesheet" href="../css/permissoes-seletor.css">
  <link rel="stylesheet" href="../css/grupos-acesso.css">
  <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="pagina-topo">
        <h1>Grupos de Acesso</h1>
        <button class="botao-primario" id="botao-incluir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Incluir
        </button>
      </div>

      <div class="barra-filtros">
        <div class="campo-busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="campo-busca" placeholder="Buscar por nome ou descrição..." aria-label="Buscar grupos">
        </div>
        <div class="abas-status">
          <button class="aba-status aba-status--ativa" id="aba-ativos">Ativos</button>
          <button class="aba-status" id="aba-inativos">Inativos</button>
        </div>
      </div>

      <div class="tabela-container">
        <table class="tabela">
          <thead>
            <tr>
              <th>Grupo</th>
              <th>Permissões</th>
              <th class="coluna-numero">Usuários</th>
              <th>Status</th>
              <th><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabela-grupos-corpo"></tbody>
        </table>
        <div class="estado-carregando" id="estado-carregando">Carregando grupos...</div>
        <div class="estado-vazio" id="estado-vazio" hidden></div>
      </div>

    </main>
  </div>

  <!-- Modal de criação/edição -->
  <div class="modal-overlay" id="modal-grupo">
    <div class="modal modal--larga" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="modal__topo">
        <span class="modal__titulo" id="modal-titulo">Novo grupo de acesso</span>
        <button type="button" class="modal__fechar" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="form-grupo" novalidate>
        <div class="modal__corpo perm-corpo-modal">

          <div class="campo-form" id="grupo-nome">
            <label for="campo-nome">Nome *</label>
            <input type="text" id="campo-nome" maxlength="60" autocomplete="off" placeholder="Ex.: Vendedores">
            <span class="campo-erro-msg" id="erro-nome"></span>
          </div>

          <div class="campo-form" id="grupo-descricao">
            <label for="campo-descricao">Descrição</label>
            <input type="text" id="campo-descricao" maxlength="255" autocomplete="off" placeholder="Para que serve este grupo (opcional)">
            <span class="campo-erro-msg" id="erro-descricao"></span>
          </div>

          <div class="perm-topo">
            <span class="perm-topo__titulo">Permissões</span>
            <div class="perm-topo__acoes">
              <span class="perm-contador" id="perm-contador" aria-live="polite"></span>
              <button type="button" class="botao-secundario" id="perm-marcar-tudo">Marcar tudo</button>
              <button type="button" class="botao-secundario" id="perm-limpar">Limpar</button>
            </div>
          </div>
          <div class="perm-lista" id="perm-lista"></div>
          <p class="dica-modal">"Criar e alterar" já inclui "Visualizar". Administradores têm acesso a tudo, independentemente do grupo.</p>

        </div>

        <div class="modal__rodape">
          <button type="button" class="botao-secundario" id="modal-cancelar">Cancelar</button>
          <button type="submit" class="botao-primario" id="modal-salvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/formatadores.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/feedback.js"></script>
  <script src="../js/components/permissoes-seletor.js"></script>
  <script src="../js/services/grupoAcessoService.js"></script>
  <script src="../js/pages/grupos-acesso.js"></script>
</body>
</html>
