<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários — Nova Sorvetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="pagina-topo">
        <h1>Usuários</h1>
        <button class="botao-primario" id="botao-incluir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Incluir
        </button>
      </div>

      <div class="barra-filtros">
        <div class="campo-busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="campo-busca" placeholder="Buscar por nome ou email...">
        </div>
        <div class="abas-status">
          <button class="aba-status aba-status--ativa" id="aba-ativos">Ativos</button>
          <button class="aba-status" id="aba-inativos">Inativos</button>
        </div>
      </div>

      <div class="tabela-container">
        <table class="tabela">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Permissão</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-usuarios-corpo"></tbody>
        </table>
        <div class="estado-vazio" id="estado-vazio" style="display: none;">
          Nenhum usuário encontrado.
        </div>
      </div>

    </main>
  </div>

  <!-- Modal de criação/edição -->
  <div class="modal-overlay" id="modal-usuario">
    <div class="modal">
      <div class="modal__topo">
        <span class="modal__titulo" id="modal-titulo">Novo usuário</span>
        <button class="modal__fechar" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form id="form-usuario">
        <div class="modal__corpo">

          <div class="campo-form">
            <label for="campo-nome">Nome *</label>
            <input type="text" id="campo-nome" required>
            <span class="campo-erro-msg">Informe o nome do usuário.</span>
          </div>

          <div class="campo-form">
            <label for="campo-email">Email *</label>
            <input type="email" id="campo-email" required>
            <span class="campo-erro-msg">Informe um email válido.</span>
          </div>

          <div class="campo-form">
            <label for="campo-senha" id="label-senha">Senha *</label>
            <input type="password" id="campo-senha" autocomplete="new-password">
            <span class="campo-erro-msg">Informe a senha.</span>
            <span class="campo-ajuda" id="ajuda-senha" style="display: none;">
              Deixe em branco para manter a senha atual.
            </span>
          </div>

          <div class="campo-checkbox">
            <input type="checkbox" id="campo-admin">
            <label for="campo-admin">Conceder permissão de administrador</label>
          </div>
          <p class="campo-checkbox__ajuda">
            Administradores têm acesso ao Dashboard, à gestão de usuários e a todas as áreas do sistema.
          </p>

        </div>

        <div class="modal__rodape">
          <button type="button" class="botao-secundario" id="modal-cancelar">Cancelar</button>
          <button type="submit" class="botao-primario" id="modal-salvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/services/usuarioService.js"></script>
  <script src="../js/pages/usuarios.js"></script>
</body>
</html>
