<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotação — Nova Sorvetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/detalhe-pedido.css">
  <link rel="stylesheet" href="../css/pedido-venda.css">
  <link rel="stylesheet" href="../css/cotacoes.css">
  <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="estado-pagina" id="estado-pagina">Carregando cotação...</div>

      <div id="conteudo-cotacao" hidden>

        <div class="pedido-topo">
          <a class="pedido-topo__voltar" href="cotacoes.html" id="link-voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Cotações
          </a>
          <div class="pedido-topo__linha">
            <h1 id="titulo-cotacao">Cotação: </h1>
            <div class="pedido-acoes">
              <span class="pilula-status" id="pilula-tipo"></span>
              <span class="pilula-status" id="pilula-status"></span>
              <span class="pilula-status pilula-status--vencida" id="pilula-vencida" hidden>Vencida</span>
              <button type="button" class="botao-secundario" id="botao-pdf">Baixar PDF</button>
              <button type="button" class="botao-secundario" id="botao-editar" hidden>Editar</button>
              <button type="button" class="botao-secundario" id="botao-enviar" hidden>Marcar como enviada</button>
              <button type="button" class="botao-secundario" id="botao-resposta" hidden>Registrar resposta do fornecedor</button>
              <button type="button" class="botao-sucesso" id="botao-aprovar" hidden>Aprovar</button>
              <button type="button" class="botao-secundario botao-secundario--perigo" id="botao-recusar" hidden>Recusar</button>
              <button type="button" class="botao-secundario botao-secundario--perigo" id="botao-excluir" hidden>Excluir</button>
              <button type="button" class="botao-primario" id="botao-salvar" hidden>Salvar alterações</button>
              <button type="button" class="botao-cancelar-vermelho" id="botao-cancelar-edicao" hidden>Cancelar edição</button>
            </div>
          </div>
        </div>

        <div class="faixa-aviso" id="faixa-aviso" hidden></div>

        <!-- Modo leitura -->
        <div id="vista">

          <section class="cartao">
            <h2 class="cartao__titulo">Dados da Cotação</h2>
            <div class="cartao-grade">
              <div class="visualizacao-item">
                <span class="visualizacao-label" id="vis-rotulo-parte">Fornecedor</span>
                <span class="visualizacao-valor" id="vis-parte">—</span>
              </div>
              <div class="visualizacao-item">
                <span class="visualizacao-label">Forma de pagamento</span>
                <span class="visualizacao-valor" id="vis-forma">—</span>
              </div>
              <div class="visualizacao-item">
                <span class="visualizacao-label">Data da cotação</span>
                <span class="visualizacao-valor" id="vis-data">—</span>
              </div>
              <div class="visualizacao-item">
                <span class="visualizacao-label">Validade</span>
                <span class="visualizacao-valor" id="vis-validade">—</span>
              </div>
              <div class="visualizacao-item cartao-grade--cheia">
                <span class="visualizacao-label" id="vis-rotulo-entrega">Entrega prevista</span>
                <span class="visualizacao-valor" id="vis-entrega">—</span>
              </div>
              <div class="visualizacao-item cartao-grade--cheia">
                <span class="visualizacao-label">Observação</span>
                <span class="visualizacao-valor" id="vis-observacao">—</span>
              </div>
            </div>
          </section>

          <section class="cartao">
            <h2 class="cartao__titulo">Itens da Cotação</h2>
            <table class="tabela-itens-leitura">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th class="num">Qtd.</th>
                  <th class="num">R$ Un.</th>
                  <th class="num" id="th-desconto">Desconto</th>
                  <th class="num">Subtotal</th>
                </tr>
              </thead>
              <tbody id="itens-corpo"></tbody>
            </table>
            <div class="total-pedido">
              <span class="total-pedido__rotulo">Total da Cotação</span>
              <span class="total-pedido__valor" id="total-exibicao">R$ 0,00</span>
            </div>
          </section>

          <section class="cartao" id="cartao-pedido" hidden>
            <h2 class="cartao__titulo">Pedido Gerado</h2>
            <p id="texto-pedido"></p>
          </section>

        </div>

        <!-- Modo edição (o mesmo formulário da Nova Cotação) -->
        <form id="edicao" hidden novalidate>
          <div id="cotacao-form"></div>
        </form>

      </div>

    </main>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/formatadores.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/feedback.js"></script>
  <script src="../js/services/cotacaoService.js"></script>
  <script src="../js/services/produtoService.js"></script>
  <script src="../js/services/fornecedorService.js"></script>
  <script src="../js/services/clienteService.js"></script>
  <script src="../js/services/formaPagamentoService.js"></script>
  <script src="../js/services/unidadeMedidaService.js"></script>
  <script src="../js/components/cotacao-form.js"></script>
  <script src="../js/pages/cotacao-detalhe.js"></script>
</body>
</html>
