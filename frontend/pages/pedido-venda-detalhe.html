<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Venda — Nova Sorvetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/detalhe-pedido.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="detalhe-topo">
        <div class="detalhe-topo__titulo-wrapper">
          <button class="botao-voltar" id="botao-voltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <h1 id="detalhe-titulo">Novo pedido de venda</h1>
          <span class="badge-status-grande" id="badge-status" style="display: none;"></span>
        </div>
        <div class="detalhe-acoes" id="acoes-container"></div>
      </div>

      <div class="painel">
        <p class="painel__titulo">Dados do pedido</p>
        <div class="painel-grid">
          <div class="campo-form">
            <label for="campo-cliente">Cliente *</label>
            <select id="campo-cliente"></select>
          </div>
          <div class="campo-form">
            <label for="campo-forma-pagamento">Forma de pagamento</label>
            <select id="campo-forma-pagamento">
              <option value="">Selecione...</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="PIX">PIX</option>
              <option value="Cartão de crédito">Cartão de crédito</option>
              <option value="Cartão de débito">Cartão de débito</option>
              <option value="Boleto">Boleto</option>
            </select>
          </div>
        </div>
        <div class="campo-form" style="margin-top: 16px;">
          <label for="campo-observacao">Observação</label>
          <textarea id="campo-observacao"></textarea>
        </div>
      </div>

      <div class="painel">
        <div class="itens-topo">
          <p class="painel__titulo" style="margin-bottom: 0;">Itens do pedido</p>
          <button class="botao-secundario" id="botao-adicionar-item">+ Adicionar item</button>
        </div>

        <table class="tabela-itens">
          <thead>
            <tr>
              <th>Produto</th>
              <th class="coluna-qtd">Qtd.</th>
              <th class="coluna-preco">Preço unit.</th>
              <th class="coluna-desconto">Desconto (%)</th>
              <th class="coluna-subtotal">Subtotal</th>
              <th class="coluna-acao"></th>
            </tr>
          </thead>
          <tbody id="tabela-itens-corpo"></tbody>
        </table>
        <div class="itens-vazio" id="itens-vazio" style="display: none;">
          Nenhum item adicionado ainda.
        </div>

        <div class="linha-totais">
          <span class="linha-totais__label">Total do pedido</span>
          <span class="linha-totais__valor" id="total-exibicao">R$ 0,00</span>
        </div>
      </div>

    </main>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/services/pedidoVendaService.js"></script>
  <script src="../js/services/produtoService.js"></script>
  <script src="../js/services/clienteService.js"></script>
  <script src="../js/pages/pedido-venda-detalhe.js"></script>
</body>
</html>
