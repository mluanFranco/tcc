<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Venda — Nova Sorvetes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/detalhe-pedido.css">
  <link rel="stylesheet" href="../css/pedido-venda.css">
  <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="estado-pagina" id="estado-pagina">Carregando pedido...</div>

      <div id="conteudo-pedido" hidden>

        <div class="pedido-topo">
          <a class="pedido-topo__voltar" href="pedidos-venda.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Pedidos de Venda
          </a>
          <div class="pedido-topo__linha">
            <h1 id="titulo-pedido">Pedido: </h1>
            <div class="pedido-acoes">
              <span class="pilula-status" id="pilula-status"></span>
              <button type="button" class="botao-secundario" id="botao-pdf">Baixar PDF</button>
              <button type="button" class="botao-sucesso" id="botao-confirmar" hidden>Confirmar</button>
              <button type="button" class="botao-cancelar-vermelho" id="botao-cancelar-pedido" hidden>Cancelar pedido</button>
            </div>
          </div>
        </div>

        <section class="cartao">
          <h2 class="cartao__titulo">Dados do Pedido</h2>
          <div class="cartao-grade">
            <div class="visualizacao-item">
              <span class="visualizacao-label">Cliente</span>
              <span class="visualizacao-valor" id="vis-cliente">—</span>
            </div>
            <div class="visualizacao-item">
              <span class="visualizacao-label">Forma de pagamento</span>
              <span class="visualizacao-valor" id="vis-forma">—</span>
            </div>
            <div class="visualizacao-item">
              <span class="visualizacao-label">Data do pedido</span>
              <span class="visualizacao-valor" id="vis-data">—</span>
            </div>
            <div class="visualizacao-item">
              <span class="visualizacao-label">Entrega</span>
              <span class="visualizacao-valor" id="vis-entrega">—</span>
            </div>
            <div class="visualizacao-item cartao-grade--cheia">
              <span class="visualizacao-label">Observação</span>
              <span class="visualizacao-valor" id="vis-observacao">—</span>
            </div>
          </div>
        </section>

        <section class="cartao">
          <h2 class="cartao__titulo">Itens do Pedido</h2>
          <table class="tabela-itens-leitura">
            <thead>
              <tr>
                <th>Produto</th>
                <th class="num">Qtd.</th>
                <th class="num">R$ Un.</th>
                <th class="num">Desconto</th>
                <th class="num">Subtotal</th>
              </tr>
            </thead>
            <tbody id="itens-corpo"></tbody>
          </table>
          <div class="total-pedido">
            <span class="total-pedido__rotulo">Total do Pedido</span>
            <span class="total-pedido__valor" id="total-exibicao">R$ 0,00</span>
          </div>
        </section>

        <section class="cartao" id="cartao-titulos" hidden>
          <h2 class="cartao__titulo">Contas a Receber</h2>
          <table class="tabela-itens-leitura">
            <thead>
              <tr>
                <th>Parcela</th>
                <th>Vencimento</th>
                <th class="num">Valor</th>
                <th class="num">Recebido</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody id="titulos-corpo"></tbody>
          </table>
          <p class="nota-cartao" id="nota-titulos" hidden></p>
        </section>

      </div>

    </main>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/formatadores.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/feedback.js"></script>
  <script src="../js/services/pedidoVendaService.js"></script>
  <script src="../js/services/produtoService.js"></script>
  <script src="../js/services/clienteService.js"></script>
  <script src="../js/services/formaPagamentoService.js"></script>
  <script src="../js/services/unidadeMedidaService.js"></script>
  <script src="../js/pages/pedido-venda-detalhe.js"></script>
</body>
</html>
