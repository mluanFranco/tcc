<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geladeiras — Nova Sorvetes</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/listagem-crud.css">
  <link rel="stylesheet" href="../css/pedido-compra.css">
  <link rel="stylesheet" href="../css/geladeiras.css">
  <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="conteudo-principal">

      <div class="pagina-topo">
        <h1>Geladeiras</h1>
        <button class="botao-primario" id="botao-incluir" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Incluir
        </button>
      </div>

      <div class="barra-filtros">
        <div class="campo-busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="campo-busca" placeholder="Buscar por série, modelo ou cliente..." aria-label="Buscar geladeiras">
        </div>
        <div class="abas-status" role="tablist">
          <button class="aba-status aba-status--ativa" id="aba-todas" data-aba="todas" role="tab" aria-selected="true">Todas</button>
          <button class="aba-status" id="aba-em_campo" data-aba="em_campo" role="tab" aria-selected="false">Em campo</button>
          <button class="aba-status" id="aba-manutencao" data-aba="manutencao" role="tab" aria-selected="false">Em manutenção</button>
          <button class="aba-status" id="aba-desativadas" data-aba="desativadas" role="tab" aria-selected="false">Desativadas</button>
        </div>
      </div>

      <div class="tabela-container">
        <table class="tabela">
          <thead>
            <tr>
              <th>Nº de série</th>
              <th>Tipo / Modelo</th>
              <th>Cliente</th>
              <th>Data de alocação</th>
              <th>Status</th>
              <th><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabela-geladeiras-corpo"></tbody>
        </table>
        <div class="estado-carregando" id="estado-carregando">Carregando geladeiras...</div>
        <div class="estado-vazio" id="estado-vazio" hidden></div>
      </div>

    </main>
  </div>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/formatadores.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/feedback.js"></script>
  <script src="../js/services/geladeiraService.js"></script>
  <script src="../js/services/clienteService.js"></script>
  <script src="../js/components/geladeira-form.js"></script>
  <script src="../js/pages/geladeiras.js"></script>
</body>
</html>
